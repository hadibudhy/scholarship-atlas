name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      VITE_ANALYTICS_REQUIRE_CONSENT: ${{ vars.ANALYTICS_REQUIRE_CONSENT || 'false' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - name: Verify GA4 configuration
        run: |
          if [[ ! "$VITE_GA_MEASUREMENT_ID" =~ ^G-[A-Za-z0-9]+$ ]]; then
            echo "GA_MEASUREMENT_ID must contain only a GA4 measurement ID such as G-XXXXXXXXXX."
            exit 1
          fi
          echo "GA4 measurement ID is configured."
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:analytics
      - run: npm run validate:data
      - run: npm run build:pages
      - run: npm run test:crawl
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
